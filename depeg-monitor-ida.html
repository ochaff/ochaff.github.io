<script>

const pct=v=>Number.isFinite(v)?(v*100).toFixed(2)+'%':'—';

function policyMarkup(){
 const level=Number.isFinite(result.probability)?riskLevel(result.probability):'Unavailable', cls=level.toLowerCase();
 const bands=[['Low','<10%'],['Elevated','10–20%'],['High','20–50%'],['Critical','≥50%']];
 return `<aside class="card policy-card" aria-label="Depeg risk monitoring"><div class="policy-top"><h2 class="eyebrow">Depeg risk monitor</h2><div class="status risk-${cls}" role="status">${level} risk</div></div><div class="probability-block"><div class="probability risk-${cls}">${pct(result.probability)}</div><p class="prob-label">Predicted probability</p><p class="prob-caption">A ±15 bps breach at any point<br>in the next 24 hours.</p></div><div class="risk-bands" aria-label="Monitoring risk levels">${bands.map(([name,range])=>`<div class="risk-band ${name===level?'current':''}"><i class="risk-dot risk-${name.toLowerCase()}"></i><span>${name}</span><strong>${range}</strong></div>`).join('')}</div><div class="policy-foot">Token at risk<strong>${escapeHtml(result.forecasting?.risk_direction||'Awaiting forecast')}</strong><span>Based on the larger 1% VaR</span></div></aside>`;

function metricsMarkup(){
 return panel('metrics',`<div class="card features-panel"><div class="feature-toolbar"><div><h2>Feature monitor</h2><p>Historical distribution + current value + local SHAP</p></div><label>Show <select id="feature-view" aria-label="Feature selection"><option value="local">Local SHAP impact</option><option value="global">Global SHAP impact</option><option value="curve_shape">Uniswap curve shape</option><option value="market">Market metrics</option><option value="curve_pool">Curve pool metrics</option><option value="uniswap_pool">Uniswap pool metrics</option><option value="all">All features</option></select></label></div><div class="feature-columns" aria-hidden="true"><span>Feature</span><span>Current value</span><span>90-day distribution · marker = current</span><span>Local SHAP</span></div><div class="features-list" id="features-list"></div><div class="feature-pagination"><span id="feature-page-info" role="status"></span><span class="distribution-note">90-day reference · tails grouped at edges</span><div><button id="features-prev" aria-label="Previous feature page">←</button><button id="features-next" aria-label="Next feature page">→</button></div></div></div>`);

function formatFeature(item){const k=item.feature,v=item.value;if(!Number.isFinite(v))return '—';if(k.startsWith('w_')||k.includes('utilisation'))return pct(v);if(k==='depeg_bps')return signed(v)+' bps';if(k.includes('fear_greed'))return number(v,0)+'/100';if(k.includes('tick_width'))return number(v,0)+' ticks';if(k.endsWith('_hours'))return number(v,1)+' h';if(k.includes('USD')||k.includes('price_usd'))return (v<0?'−':'')+'$'+new Intl.NumberFormat('en-US',{notation:Math.abs(v)>=1e6?'compact':'standard',maximumFractionDigits:2}).format(Math.abs(v));if(Math.abs(v)>=10000)return new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(v);return number(v,Math.abs(v)<1?4:2)}
function histogramSVG(item){const h=item.histogram;if(!h?.counts?.length)return '<span class="histogram-pending">Distribution awaits model refresh</span>';const w=260,pad=5,plotWidth=w-2*pad,height=43,top=5,max=Math.max(...h.counts,1),bar=plotWidth/h.counts.length,lo=h.edges[0],hi=h.edges.at(-1),raw=(item.value-lo)/(hi-lo),x=pad+Math.max(0,Math.min(1,raw))*plotWidth;
 const info=`Current ${formatFeature(item)}; percentile ${number(h.percentile,1)}. ${h.reference_count} observed hourly values; ${time(h.reference_start)} to ${time(h.reference_end)}. Outside 0.5th–99.5th percentiles grouped at edges.`;
 return `<svg class="feature-histogram" viewBox="0 0 ${w} 56" role="img" aria-label="${escapeHtml(info)}"><title>${escapeHtml(info)}</title>${h.counts.map((v,i)=>{const bh=v/max*(height-top);return `<rect x="${pad+i*bar}" y="${height-bh}" width="${Math.max(.5,bar-1)}" height="${bh}" rx="1" fill="#05447655"><title>${number(h.edges[i],4)} to ${number(h.edges[i+1],4)}: ${v} hours</title></rect>`}).join('')}<line x1="${x}" x2="${x}" y1="2" y2="${height+2}" stroke="#17384f" stroke-width="1.6"/><path d="M ${x-3} 0 L ${x+3} 0 L ${x} 5 Z" fill="#17384f"/><text x="${pad}" y="55" font-size="7" fill="#61798b">${number(lo,Math.abs(lo)<1?3:0)}</text><text x="${w-pad}" y="55" text-anchor="end" font-size="7" fill="#61798b">${number(hi,Math.abs(hi)<1?3:0)}</text>${raw<0||raw>1?`<text x="${Math.min(w-6,Math.max(6,x))}" y="11" text-anchor="${raw<0?'start':'end'}" font-size="8" fill="#17384f">${raw<0?'←':'→'}</text>`:''}</svg>`;

function featureRows(){let rows=(result.feature_catalog||[]).slice();if(!rows.length){const local=new Map((result.local_shap||[]).map(x=>[x.feature,x]));rows=[...new Set([...(result.local_shap||[]).map(x=>x.feature),...Object.keys(result.notable_values||{}).filter(k=>k!=='display_names')])].map(feature=>({feature,display_name:local.get(feature)?.display_name||feature,value:local.get(feature)?.feature_value??result.notable_values?.[feature],local_shap:local.get(feature)?.shap_value??null,global_impact:result.global_shap?.find(x=>x.feature===feature)?.importance??null}))}
 const view=document.getElementById('feature-view').value;if(view==='local')rows=rows.filter(r=>Number.isFinite(r.local_shap));else if(view==='global')rows=rows.filter(r=>Number.isFinite(r.global_impact));else if(view!=='all')rows=rows.filter(r=>r.group===view);const score=r=>view==='global'?(r.global_impact??-1):Number.isFinite(r.local_shap)?Math.abs(r.local_shap):-1;return rows.sort((a,b)=>score(b)-score(a)||a.feature.localeCompare(b.feature));}
function drawFeatures(){const list=document.getElementById('features-list');if(!list||document.getElementById('metrics').hidden)return;const rows=featureRows(),size=Math.max(2,Math.min(window.innerWidth<=700?5:8,Math.floor(list.clientHeight/(window.innerWidth<=700?95:72)))),pages=Math.max(1,Math.ceil(rows.length/size));featurePage=Math.min(Math.max(0,featurePage),pages-1);const selected=rows.slice(featurePage*size,(featurePage+1)*size);list.style.setProperty('--feature-rows',Math.max(1,selected.length));list.innerHTML=selected.map(item=>{const shap=item.local_shap,cls=!Number.isFinite(shap)?'missing':shap>0?'positive':shap<0?'negative':'neutral';return `<article class="feature-row"><div class="feature-name"><strong>${escapeHtml(item.display_name||item.feature)}</strong><small>${escapeHtml(item.feature)}${document.getElementById('feature-view').value==='global'&&Number.isFinite(item.global_impact)?' · Global '+number(item.global_impact,4):''}</small></div><div class="feature-current"><strong>${escapeHtml(formatFeature(item))}</strong><small>${Number.isFinite(item.histogram?.percentile)?'P'+number(item.histogram.percentile,1):''}</small></div><div class="histogram-cell">${histogramSVG(item)}</div><div class="feature-shap ${cls}" title="Local SHAP contribution to the base forest score"><span>${Number.isFinite(shap)?(shap>0?'+':'')+number(shap,4):'—'}</span><small>${Number.isFinite(shap)?shap>0?'Increases risk':shap<0?'Decreases risk':'Neutral':'Not attributed'}</small></div></article>`}).join('')||'<div class="loading">No features in this group.</div>';document.getElementById('feature-page-info').textContent=rows.length?`${featurePage*size+1}–${Math.min((featurePage+1)*size,rows.length)} of ${rows.length} features`:'No features';document.getElementById('features-prev').disabled=featurePage===0;document.getElementById('features-next').disabled=featurePage>=pages-1;}
function driversMarkup(){return panel('drivers',`<div class="panel-bar"><h2>What drives the model?</h2><label>Features <select id="feature-count" aria-label="Number of SHAP features"><option value="8" selected>Top 8</option><option value="12">Top 12</option><option value="20">Top 20</option></select></label></div><div class="mobile-selector" aria-label="Explanation view"><button data-driver="local" aria-pressed="true">This observation</button><button data-driver="global" aria-pressed="false">Global importance</button></div><div class="driver-grid"><div class="card driver-card mobile-active" data-driver-card="local"><div class="panel-title"><div><h2>This observation</h2><p>Local SHAP contributions</p></div></div><div class="driver-stage"><canvas id="local-chart" role="img" aria-label="Local SHAP contributions"></canvas></div><div class="driver-caption">Red increases the base forest score; green decreases it.<br>SHAP explains the forest before probability calibration.</div></div><div class="card driver-card" data-driver-card="global"><div class="panel-title"><div><h2>Across the test set</h2><p>Mean absolute SHAP importance</p></div></div><div class="driver-stage"><canvas id="global-chart" role="img" aria-label="Global SHAP feature importance"></canvas></div><div class="driver-caption">Larger bars indicate greater average influence on the base forest score.</div></div></div>`,'drivers-layout')}
function facts(items){return `<dl class="facts">${items.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`}
function modelsMarkup(){const f=result.forecasting;
 return panel('models',`<div class="panel-bar"><h2>Models & calibration</h2></div><div class="mobile-selector" aria-label="Model details"><button data-model="policy" aria-pressed="true">Monitoring model</button><button data-model="forecast" aria-pressed="false">Forecasting</button></div><div class="model-grid"><div class="card model-card mobile-active" data-model-card="policy"><h3>Monitoring Random Forest</h3>${facts([['Prediction target','Any breach · next 24h'],['Depeg threshold','±15 bps'],['Train / calibration / test','70% / 15% / 15%'],['Low risk','<10%'],['Elevated risk','10–20%'],['High risk','20–50%'],['Critical risk','≥50%'],['Test AUC',number(result.auc,3)],['Test Brier score',number(result.brier_score,4)]])}<p>Calibrated probability of any threshold breach in the next 24 hours, including ongoing dislocations. Risk bands describe monitoring severity.</p><p class="model-note">The forest and probability calibrator use separate chronological periods. Complete outcome windows and causal imputation prevent future observations from entering model fitting. SHAP explains the base forest score.</p></div><div class="card model-card" data-model-card="forecast"><h3>24-hour distribution forecast</h3>${facts([['Model',escapeHtml(f?.model||'—')],['Innovations','Student-t'],['Training observations',number(f?.fit_rows,0)],['Simulated paths',number(f?.simulations,0)],['Degrees of freedom',number(f?.parameters?.nu,2)],['Quote convention','USDT per USDC'],['Forecast origin',time(f?.timestamp||result.timestamp)]])}<p>The price chart shows the simulated median and 1st–99th percentile interval at each of the next 24 hours. Optional ES curves show the mean of the lowest and highest 1% of signed price outcomes.</p><p class="model-note">Forecast hover values use basis points from peg. The token at risk follows the larger 1% VaR at hour 24. Price-chart tail means retain their sign even if the whole tail lies above peg.</p></div></div>`,'models-layout');}
function switchTab(name,focus=false){activeTab=name;document.querySelectorAll('[role=tab]').forEach(b=>{const chosen=b.dataset.tab===name;b.setAttribute('aria-selected',String(chosen));b.tabIndex=chosen?0:-1;if(chosen&&focus)b.focus()});document.querySelectorAll('[role=tabpanel]').forEach(p=>p.hidden=p.id!==name);requestAnimationFrame(()=>{if(name==='overview')priceChart?.resize();if(name==='drivers')drawDrivers();if(name==='metrics')drawFeatures();if(name==='liquidity'){document.querySelectorAll('.curve-frame').forEach(frame=>{if(!frame.getAttribute('src'))frame.src=frame.dataset.source+'?v='+encodeURIComponent(result.timestamp)+'&schema='+encodeURIComponent(result.schema_version||1)});fitLiquidity()}})}
function drawPrice(){
 priceChart?.destroy();const forecast=result.forecasting?.hourly||[],history=result.price_history||[],origin=stamp(result.forecasting?.timestamp||result.timestamp),hours=Number(document.getElementById('history-window').value),from=origin-hours*3600000;

 const end=origin+24*3600000,earliest=observed[0]?.x??origin,threshold=result.target_threshold_bps||15,unit=document.getElementById('chart-unit').value;

 {...base,label:'Forecast median',data:hasMedian?field('median_bps'):[],borderColor:RED,borderWidth:2,borderDash:[5,3]},
 {...base,label:'1% ES (lower)',data:hasES?field('lower_es_1pct_bps'):[],borderColor:RED,borderDash:[2,4],hidden:!showES},
 {...base,label:'99% ES (upper)',data:hasES?field('upper_es_1pct_bps'):[],borderColor:RED,borderDash:[2,4],hidden:!showES},
 ...[-threshold,threshold].map(t=>({...base,label:(t>0?'+':'')+t+' bps threshold',data:[{x:earliest,y:t},{x:end,y:t}],borderColor:'#DB354999',borderWidth:1,borderDash:[6,5],pointHitRadius:0})),
 {...base,label:'Peg',data:[{x:earliest,y:0},{x:end,y:0}],borderColor:'#b7c8d4',borderWidth:1,pointHitRadius:0}];
 const originMarker={id:'forecastOrigin',beforeDatasetsDraw(chart){const {ctx,chartArea:a,scales:{x}}=chart,px=x.getPixelForValue(origin);ctx.save();ctx.fillStyle='#05447604';ctx.fillRect(px,a.top,a.right-px,a.bottom-a.top);ctx.strokeStyle='#9cafbe';ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(px,a.top);ctx.lineTo(px,a.bottom);ctx.stroke();ctx.setLineDash([]);ctx.font='10px -apple-system, sans-serif';ctx.fillStyle=MUTED;ctx.fillText('24h forecast →',Math.min(px+8,a.right-90),a.top+12);ctx.restore()},afterDraw(chart){const {ctx,chartArea:a,scales:{y}}=chart;ctx.save();ctx.font='9px -apple-system, sans-serif';ctx.fillStyle=RED;for(const value of [-threshold,threshold]){const py=y.getPixelForValue(value);if(py>a.top+10&&py<a.bottom)ctx.fillText((value>0?'+':'')+value+' bps',a.left+5,py-5)}ctx.restore()}};
 priceChart=new Chart(document.getElementById('price-chart'),{type:'line',data:{datasets},plugins:[originMarker],options:{responsive:true,maintainAspectRatio:false,animation:false,parsing:false,normalized:true,interaction:{mode:'nearest',axis:'x',intersect:false},layout:{padding:{top:8,right:5}},plugins:{legend:{display:false},tooltip:{backgroundColor:'#ffffff',titleColor:BLUE,bodyColor:BLUE,borderColor:LINE,borderWidth:1,filter:c=>c.datasetIndex<6,callbacks:{title:items=>items.length?time(items[0].parsed.x):'',label:c=>c.dataset.label+': '+(c.datasetIndex===0&&unit==='price'?number(1+c.parsed.y/10000,6)+' ('+signed(c.parsed.y)+' bps)':signed(c.parsed.y)+' bps')}}},scales:{x:{type:'linear',min:earliest,max:end,border:{display:false},grid:{color:'#edf2f6'},ticks:{color:MUTED,maxTicksLimit:window.innerWidth<701?4:7,stepSize:(hours<=24?12:hours<=72?24:48)*3600000,font:{size:10},callback:v=>shortTime(v)}},y:{suggestedMin:-threshold-2,suggestedMax:threshold+2,border:{display:false},grid:{color:'#edf2f6'},title:{display:window.innerWidth>700,text:unit==='price'?'USDT per USDC':'Deviation from peg (bps)',color:MUTED,font:{size:10}},ticks:{color:MUTED,maxTicksLimit:7,font:{size:10},callback:v=>unit==='price'?(1+v/10000).toFixed(4):(v>0?'+':'')+v}},yBps:{position:'right',display:unit==='price'&&window.innerWidth>700,border:{display:false},grid:{display:false},ticks:{color:MUTED,font:{size:9},maxTicksLimit:7,callback:v=>(v>0?'+':'')+v+' bps'},afterDataLimits(axis){const y=axis.chart.scales.y;axis.min=y.min;axis.max=y.max}}}}});
}
function drawDrivers(){driverCharts.forEach(c=>c.destroy());driverCharts=[];const count=Number(document.getElementById('feature-count').value);for(const [kind,id] of [['local','local-chart'],['global','global-chart']]){const items=(result[kind+'_shap']||[]).slice(0,count).reverse(),vals=items.map(i=>i.shap_value??i.importance);driverCharts.push(new Chart(document.getElementById(id),{type:'bar',data:{labels:items.map(i=>i.display_name||i.feature),datasets:[{data:vals,backgroundColor:vals.map(v=>kind==='local'?(v>0?RED:v<0?'#198367':MUTED):BLUE),borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,animation:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'#edf2f6'},ticks:{color:MUTED,font:{size:9}}},y:{grid:{display:false},ticks:{color:BLUE,font:{size:window.innerWidth<701?9:11}}}}}}));}}
function fitLiquidity(){document.querySelectorAll('.curve-frame').forEach(frame=>{const doc=frame.contentDocument;if(!doc?.body||frame.clientWidth<50||frame.clientHeight<50)return;doc.documentElement.style.cssText='height:100%;margin:0;overflow:hidden';doc.body.style.cssText='height:100%;margin:0;overflow:hidden';const controls=doc.querySelector('[data-liquidity-controls]'),wrapper=doc.body.querySelector(':scope > div'),plot=doc.querySelector('.plotly-graph-div'),height=frame.clientHeight-(controls?.getBoundingClientRect().height||0);if(wrapper)wrapper.style.cssText='width:100%;height:'+height+'px;';if(plot&&!plot._fullLayout){if(!frame.dataset.waiting){frame.dataset.waiting='1';frame.contentWindow.requestAnimationFrame(()=>{delete frame.dataset.waiting;fitLiquidity()})}return}if(plot&&frame.contentWindow.Plotly){plot.style.width='100%';plot.style.height='100%';const curve=frame.dataset.kind==='curve';frame.contentWindow.Plotly.relayout(plot,{height,width:frame.clientWidth,autosize:true,margin:{l:window.innerWidth<701?44:54,r:12,t:curve?40:50,b:curve?35:controls?35:80},legend:{orientation:'h',yanchor:'bottom',y:1.02,xanchor:'center',x:.5,traceorder:'normal',font:{size:10}}})}})}
async function init(){try{const response=await fetch('dashboard_data/rf_results.json?v='+Date.now());if(!response.ok)throw new Error('Data unavailable');result=await response.json();document.getElementById('updated').textContent=time(result.timestamp);const app=document.getElementById('app');app.innerHTML=overviewMarkup()+metricsMarkup()+driversMarkup()+panel('liquidity',`<div class="liquidity-switch mobile-selector" aria-label="Liquidity venue"><button data-venue="uniswap" aria-pressed="true">Uniswap</button><button data-venue="curve" aria-pressed="false">Curve</button></div><div class="liquidity-grid"><div class="card liquidity-card venue-active" data-venue-card="uniswap"><div class="panel-title"><div><h2>Uniswap · USDC / USDT</h2><p>Liquidity distribution by price</p></div></div><iframe class="curve-frame" data-kind="uniswap" data-source="figures/uni_liquidity.html" title="Uniswap liquidity curve composition"></iframe></div><div class="card liquidity-card" data-venue-card="curve"><div class="panel-title"><div><h2>Curve · 3pool</h2><p>Reserve composition over time</p></div></div><iframe class="curve-frame" data-kind="curve" data-source="figures/crv_balance.html" title="Curve 3pool reserve composition"></iframe></div></div>`,'liquidity-layout')+modelsMarkup();app.setAttribute('aria-busy','false');liquidityFrame=document.querySelector('.curve-frame');document.querySelectorAll('.curve-frame').forEach(frame=>{frame.addEventListener('load',fitLiquidity);new ResizeObserver(()=>{if(activeTab==='liquidity')fitLiquidity()}).observe(frame)});document.querySelectorAll('[data-venue]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-venue]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));document.querySelectorAll('[data-venue-card]').forEach(c=>c.classList.toggle('venue-active',c.dataset.venueCard===b.dataset.venue));fitLiquidity()}));document.getElementById('feature-view').addEventListener('change',()=>{featurePage=0;drawFeatures()});document.getElementById('features-prev').addEventListener('click',()=>{featurePage--;drawFeatures()});document.getElementById('features-next').addEventListener('click',()=>{featurePage++;drawFeatures()});new ResizeObserver(()=>drawFeatures()).observe(document.getElementById('features-list'));['history-window','chart-unit','show-interval','show-es'].forEach(id=>document.getElementById(id).addEventListener('change',drawPrice));document.getElementById('feature-count').addEventListener('change',drawDrivers);document.querySelectorAll('[data-driver]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-driver]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));document.querySelectorAll('[data-driver-card]').forEach(c=>c.classList.toggle('mobile-active',c.dataset.driverCard===b.dataset.driver));drawDrivers()}));document.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-model]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));document.querySelectorAll('[data-model-card]').forEach(c=>c.classList.toggle('mobile-active',c.dataset.modelCard===b.dataset.model))}));drawPrice();}catch(error){document.getElementById('app').innerHTML='<div class="loading" role="alert">Dashboard data is unavailable. Please try again later.</div>';document.getElementById('app').setAttribute('aria-busy','false');console.error(error)}}
document.querySelectorAll('[role=tab]').forEach((button,index,buttons)=>{button.addEventListener('click',()=>{if(result)switchTab(button.dataset.tab)});button.addEventListener('keydown',event=>{let next;if(event.key==='ArrowRight')next=(index+1)%buttons.length;if(event.key==='ArrowLeft')next=(index+buttons.length-1)%buttons.length;if(event.key==='Home')next=0;if(event.key==='End')next=buttons.length-1;if(next!==undefined&&result){event.preventDefault();switchTab(buttons[next].dataset.tab,true)}})});
window.addEventListener('resize',()=>{if(activeTab==='liquidity')fitLiquidity();if(activeTab==='metrics')drawFeatures()});
init();
</script>
