name: AMMonitor Model Update

on:
  # The data repository should send this event after publishing a release.
  repository_dispatch:
    types: [data-release, model-release]
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      model_release:
        description: 'Optional model release tag for rollback; blank uses newest published ANGEL bundle'
        required: false
        default: ''
        type: string
      skip_data_update:
        description: 'Skip the data download step (use existing data)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

concurrency:
  group: ammonitor-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    # Pin the image so a runner-image rollout cannot change this workload.
    runs-on: ubuntu-24.04
    # Dataset construction is memory-intensive and can exceed one hour.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-monitor.txt
          pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-angel.txt

      - name: Verify alpha consistency, monitoring, ALE and ANGEL exports
        run: |
          python -m pytest -q tests/test_monitor_models.py tests/test_training_protocol.py tests/test_ale.py tests/test_dataset_rf.py tests/test_angel_forecast.py tests/test_angel_explanations.py tests/test_prediction_history.py
          node tests/test_angel_explainer.cjs
          node tests/test_prediction_scorer.cjs

      - name: Download latest on-chain data
        if: ${{ github.event.inputs.skip_data_update != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash update_data.sh

      # train_rf.py builds the exact dataset it trains on, so avoid duplicate
      # alpha=0.1 dataset construction.
      - name: Report runner resources
        run: |
          free -h
          df -h

      - name: Run newest published alpha-0.1 ANGEL bundle and export selection weights on CPU
        env:
          GH_TOKEN: ${{ github.token }}
          ANGEL_RELEASE: ${{ inputs.model_release }}
          OMP_NUM_THREADS: 2
          OPENBLAS_NUM_THREADS: 2
          ANGEL_CPU_THREADS: 2
        run: |
          mkdir -p .angel-cache dashboard_data
          release_args=()
          if [ -n "$ANGEL_RELEASE" ]; then release_args+=(--tag "$ANGEL_RELEASE"); fi
          python -u angel_forecast.py "${release_args[@]}" --output dashboard_data/angel_forecast.json

      - name: Train monitoring Random Forest and ALE; attach ANGEL forecast
        env:
          OMP_NUM_THREADS: 2
          OPENBLAS_NUM_THREADS: 2
          MKL_NUM_THREADS: 2
          NUMEXPR_NUM_THREADS: 2
          RF_N_JOBS: 1
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dashboard_data
          python -u train_rf.py --alpha 0.1 --forecast-json dashboard_data/angel_forecast.json

      - name: Archive model results and protocol
        uses: actions/upload-artifact@v4
        with:
          name: ammonitor-model-results
          path: |
            dashboard_data/rf_results.json
            dashboard_data/feature_dictionary.json
            dashboard_data/ale_results.json
            dashboard_data/angel_forecast.json
            dashboard_data/rf_prediction_history.json
          if-no-files-found: error

      - name: Commit and push dashboard data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data/rf_results.json dashboard_data/feature_dictionary.json dashboard_data/ale_results.json dashboard_data/angel_forecast.json dashboard_data/rf_prediction_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update AMMonitor monitoring data [skip ci]"
            git push
          fi
